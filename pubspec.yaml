name: day_planner
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  collection: ^1.19.1
  cupertino_icons: ^1.0.8
  drift: ^2.34.0
  equatable: ^2.1.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^17.1.2
  flutter_riverpod: ^3.3.2
  flutter_timezone: ^5.1.0
  freezed_annotation: ^3.1.0
  go_router: ^17.3.0
  intl: ^0.20.3
  json_annotation: ^4.12.0
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  sqlite3: ^3.3.4
  sqlite3_flutter_libs: ^0.6.0+eol
  timezone: ^0.9.2
  uuid: ^4.5.3

dev_dependencies:
  build_runner: ^2.15.0
  drift_dev: ^2.34.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  json_serializable: ^6.14.0
  mocktail: ^1.0.5
  test: ^1.31.0
  flutter_launcher_icons: ^0.14.4
  

flutter:
  uses-material-design: true
  assets:
    - assets/logo/app_icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo/app_icon.png"

  web:
    generate: true

  windows:
    generate: true

  macos:
    generate: true

  linux:
    generate: true